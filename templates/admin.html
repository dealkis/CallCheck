<!DOCTYPE html>
<html>
<head>
    <title>Painel Admin</title>
</head>
<body>

<h2>Cadastrar Empresa</h2>

<form method="POST">
    <input type="text" name="nome" placeholder="Nome da empresa" required><br><br>
    <input type="text" name="telefone" placeholder="Telefone"><br><br>
    <button type="submit">Cadastrar</button>
</form>

{% if mensagem %}
    <p>{{ mensagem }}</p>
{% endif %}

</body>
</html>
