{% extends "base.html" %}

{% block content %}
<section class="hero">
    <h1>Entre em Contato</h1>
    <p>Dúvidas sobre o CallCheck, sugestões ou solicitações de parceria empresarial.</p>
</section>

<div class="resultado" style="flex-direction: column; width: 450px; margin: 0 auto;">
    <div class="info">
        <h3>Preencha os dados abaixo</h3>
        
        <!-- Substitua 'xdabeqgd' pelo seu ID se necessário, mas este já é o seu -->
        <form id="form-contato" action="https://formspree.io/f/xdabeqgd" method="POST" class="form-box" style="display: flex; flex-direction: column; width: 100%;">
            
            <label for="nome" style="margin-left: 10px; font-weight: bold;">Nome:</label>
            <input type="text" id="nome" name="nome" placeholder="Seu nome completo" required style="width: 90%; margin-bottom: 15px;">

            <label for="email" style="margin-left: 10px; font-weight: bold;">E-mail:</label>
            <input type="email" id="email" name="email" placeholder="exemplo@email.com" required style="width: 90%; margin-bottom: 15px;">
            
            <label for="assunto" style="margin-left: 10px; font-weight: bold;">Assunto:</label>
            <select name="assunto" style="padding: 10px; margin: 10px; width: 95%; border-radius: 5px; border: 1px solid #ccc; margin-bottom: 15px;">
                <option value="duvida">Dúvida Geral</option>
                <option value="parceria">Sou uma Empresa (Parceria)</option>
                <option value="denuncia">Reportar número suspeito</option>
                <option value="outro">Outros</option>
            </select>

            <label for="mensagem" style="margin-left: 10px; font-weight: bold;">Mensagem:</label>
            <textarea id="mensagem" name="mensagem" placeholder="Como podemos ajudar?" required style="padding: 10px; margin: 10px; width: 90%; height: 120px; border-radius: 5px; border: 1px solid #ccc; font-family: Arial; resize: vertical;"></textarea>
            
            <button type="submit" id="btn-enviar" style="background: #000; color: #fff; border: none; border-radius: 5px; padding: 12px; cursor: pointer; font-weight: bold; margin-top: 10px; transition: 0.3s;">
                Enviar Mensagem
            </button>

            <!-- Área para exibir a mensagem de sucesso ou erro -->
            <p id="status-envio" style="margin-top: 15px; font-weight: bold; text-align: center;"></p>
        </form>
    </div>
</div>

<script>
    const form = document.getElementById("form-contato");
    const status = document.getElementById("status-envio");
    const botao = document.getElementById("btn-enviar");

    // Função que intercepta o envio do formulário
    async function handleSubmit(event) {
        event.preventDefault(); // Impede a página de recarregar ou ir para o Formspree
        
        const data = new FormData(event.target);
        
        // Feedback visual imediato
        botao.disabled = true;
        botao.innerText = "Enviando...";
        status.innerHTML = "Processando seu envio...";

        // Envio via AJAX (Fetch API)
        fetch(event.target.action, {
            method: form.method,
            body: data,
            headers: {
                'Accept': 'application/json'
            }
        }).then(response => {
            if (response.ok) {
                // Sucesso: Mostra mensagem verde e limpa o form
                status.style.color = "#155724";
                status.innerHTML = "✔ Sucesso! Recebemos sua mensagem. Responderemos em breve.";
                form.reset();
            } else {
                // Erro do servidor
                response.json().then(data => {
                    if (Object.hasOwn(data, 'errors')) {
                        status.innerHTML = data["errors"].map(error => error["message"]).join(", ");
                    } else {
                        status.innerHTML = "❌ Ocorreu um erro ao enviar.";
                    }
                })
            }
        }).catch(error => {
            // Erro de conexão
            status.style.color = "#721c24";
            status.innerHTML = "❌ Erro de conexão. Verifique sua internet.";
        }).finally(() => {
            // Restaura o botão
            botao.disabled = false;
            botao.innerText = "Enviar Mensagem";
        });
    }

    form.addEventListener("submit", handleSubmit);
</script>
{% endblock %}
